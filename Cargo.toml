[package]
name = "mindspace"
version = "0.5.0"
edition = "2021"
# Minimum supported Rust version, checked by the `msrv` CI job. The development and CI toolchain is
# pinned separately in rust-toolchain.toml.
rust-version = "1.96"
description = "Local-first memory engine: sources are evidence, memories are interpretations."
license = "MIT"
repository = "https://github.com/VikingOwl91/mindspace"
readme = "README.md"
keywords = ["memory", "mcp", "sqlite", "code-search", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
name = "mindspace"
path = "src/lib.rs"

[[bin]]
name = "mind"
path = "src/main.rs"

[features]
default = ["embeddings"]
# Test harness only: compiles the spawn-gate entrypoint (`MINDSPACE_SPAWN_GATE`). Never enabled by a
# plain `cargo build`; the dev-dependency below turns it on for `cargo test` builds only.
spawn-gate = []
embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:ureq", "dep:rustix"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
ignore = "0.4.34"
pulldown-cmark = "0.13.6"
rusqlite = { version = "0.41.0", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24.2"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23", optional = true }
ureq = { version = "2", optional = true, features = ["tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"], optional = true }
# Kernel sandbox for the MCP repository tools (ADR-029). Linux only.
landlock = "0.4.7"

[target.'cfg(unix)'.dependencies]
# Descriptor-level file access for the grant store (O_NOFOLLOW, fstat checks) and the Linux sandbox.
libc = "0.2"

[dev-dependencies]
mindspace = { path = ".", features = ["spawn-gate"] }
tempfile = "3.27.0"
