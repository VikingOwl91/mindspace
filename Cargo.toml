[package]
name = "mindspace"
version = "0.3.0"
edition = "2021"
description = "Local-first memory engine: sources are evidence, memories are interpretations."
license = "MIT"

[lib]
name = "mindspace"
path = "src/lib.rs"

[[bin]]
name = "mind"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
pulldown-cmark = "0.13.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
